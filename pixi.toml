[workspace]
authors = ["looooo <sppedflyer@gmail.com>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "freecad.gears"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "win-64", "osx-64"]

[pypi-dependencies]
freecad-visual-tests = "*"
freecad_gears = { path = ".", editable = true }
pytest = "*"

[tasks]
lint = "pylint $(git ls-files '*.py')"
test = "pytest tests/ -v -m 'not visual'"
test-visual = "pytest tests/test_visual_projects.py -v -s"
test-visual-xvfb = "python scripts/run_visual_tests_xvfb.py"
test-all = "pytest tests/ -v -s -m 'not visual' && pytest tests/test_visual_projects.py -v -s"
create-references = "VISUAL_TEST_REFERENCE_MODE=update pytest tests/test_visual_projects.py -v -s"
create-references-xvfb = { cmd = "python scripts/run_visual_tests_xvfb.py", env = { VISUAL_TEST_REFERENCE_MODE = "update" } }
clean-test = "rm -rf tests/data/*/artifacts tests/data/*/references"

[dependencies]
freecad = ">=1.0.0,<2"
numpy = ">=1.26,<1.27"
scipy = "*"
sympy = "*"
jupyter = "*"
pylint = "*"
matplotlib = "*"
fontconfig = "2.17.1.*"
